server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;

    location / { try_files $uri $uri/ =404; }
    location ~* \.(?:css|js)$ { expires 1h; add_header Cache-Control "public"; }

    # Rate limit: 3 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=tarot_ai:10m rate=3r/m;

    # AI proxy — server-side only, hardcoded model + max_tokens
    location /api/tarot {
        # Rate limit with small burst
        limit_req zone=tarot_ai burst=2 nodelay;
        limit_req_status 429;

        # Only POST allowed
        limit_except POST { deny all; }

        # Block direct body forwarding — rewrite request with fixed params
        # Use a subrequest to validate and proxy
        proxy_pass http://omniroute:20129/v1/chat/completions;
        proxy_set_header Content-Type "application/json";
        proxy_set_header Authorization "Bearer $http_authorization"; # unused by Node image; do not store credentials here
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Max request body size (prevent abuse)
        client_max_body_size 8k;
    }
}
