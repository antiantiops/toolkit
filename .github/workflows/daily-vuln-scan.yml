name: Daily Vulnerability Scan

on:
  schedule:
    # Run daily at 20:00 UTC (3:00 AM Vietnam)
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      severity:
        description: 'Minimum severity (critical,high,medium,low)'
        required: false
        default: 'critical,high,medium'

jobs:
  nuclei-scan:
    runs-on: ubuntu-latest
    container:
      image: projectdiscovery/nuclei:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Nuclei
        run: nuclei -version

      - name: Restore previous scan cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: scan-history/
          key: vuln-scan-
          restore-keys: |
            vuln-scan-

      - name: Update Nuclei templates
        run: nuclei -ut

      - name: Run vulnerability scan
        run: |
          SEVERITY="${{ github.event.inputs.severity || 'critical,high,medium' }}"

          if [ ! -f targets.txt ]; then
            echo "::error::targets.txt not found"
            exit 1
          fi

          grep -vE '^\s*#|^\s*$' targets.txt > /tmp/active_targets.txt || true
          TARGET_COUNT=$(wc -l < /tmp/active_targets.txt)
          echo "Scanning $TARGET_COUNT targets with severity: $SEVERITY"

          mkdir -p scan-results

          nuclei \
            -l /tmp/active_targets.txt \
            -severity "$SEVERITY" \
            -je scan-results/current.json \
            -silent \
            -timeout 15 \
            -retries 2 \
            -bulk-size 25 \
            -rate-limit 50 \
            || true

      - name: Analyze results
        id: analyze
        run: |
          mkdir -p scan-history

          if [ ! -f scan-results/current.json ] || [ ! -s scan-results/current.json ]; then
            echo "[]" > scan-results/current.json
          fi

          # Count using grep -o (BusyBox grep, no -P support)
          TOTAL=$(grep -o '"template-id"' scan-results/current.json | wc -l)
          CRITICAL=$(grep -o '"severity":"critical"' scan-results/current.json | wc -l)
          HIGH=$(grep -o '"severity":"high"' scan-results/current.json | wc -l)
          MEDIUM=$(grep -o '"severity":"medium"' scan-results/current.json | wc -l)

          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "medium=$MEDIUM" >> $GITHUB_OUTPUT

          # Compare with previous scan using signatures
          NEW_COUNT=$TOTAL
          if [ -f scan-history/previous.json ] && [ -s scan-history/previous.json ]; then
            # Extract host|template-id signatures
            sed 's/},{/}\n{/g' scan-history/previous.json | sed 's/^\[//;s/\]$//' | while IFS= read -r obj; do
              host=$(echo "$obj" | sed -n 's/.*"host":"\([^"]*\)".*/\1/p')
              tid=$(echo "$obj" | sed -n 's/.*"template-id":"\([^"]*\)".*/\1/p')
              [ -n "$tid" ] && echo "$host|$tid"
            done | sort -u > /tmp/prev_sigs.txt

            sed 's/},{/}\n{/g' scan-results/current.json | sed 's/^\[//;s/\]$//' | while IFS= read -r obj; do
              host=$(echo "$obj" | sed -n 's/.*"host":"\([^"]*\)".*/\1/p')
              tid=$(echo "$obj" | sed -n 's/.*"template-id":"\([^"]*\)".*/\1/p')
              [ -n "$tid" ] && echo "$host|$tid"
            done | sort -u > /tmp/curr_sigs.txt

            NEW_COUNT=$(comm -13 /tmp/prev_sigs.txt /tmp/curr_sigs.txt | wc -l)
          fi

          echo "new_count=$NEW_COUNT" >> $GITHUB_OUTPUT

          # Build findings summary
          sed 's/},{/}\n{/g' scan-results/current.json | sed 's/^\[//;s/\]$//' | head -10 | while IFS= read -r obj; do
            sev=$(echo "$obj" | sed -n 's/.*"severity":"\([^"]*\)".*/\1/p')
            name=$(echo "$obj" | sed -n 's/.*"name":"\([^"]*\)".*/\1/p')
            host=$(echo "$obj" | sed -n 's/.*"host":"\([^"]*\)".*/\1/p')
            sev_up=$(echo "$sev" | tr '[:lower:]' '[:upper:]')
            [ -n "$name" ] && echo "[$sev_up] $name -> $host"
          done > /tmp/findings_summary.txt 2>/dev/null || true

          {
            echo 'findings<<FINDINGSEOF'
            cat /tmp/findings_summary.txt 2>/dev/null || true
            echo 'FINDINGSEOF'
          } >> $GITHUB_OUTPUT

          echo "Found: $TOTAL total ($CRITICAL critical, $HIGH high, $MEDIUM medium), $NEW_COUNT new"

      - name: Send Telegram alert
        if: steps.analyze.outputs.new_count != '0' && steps.analyze.outputs.total != '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TOTAL="${{ steps.analyze.outputs.total }}"
          CRITICAL="${{ steps.analyze.outputs.critical }}"
          HIGH="${{ steps.analyze.outputs.high }}"
          MEDIUM="${{ steps.analyze.outputs.medium }}"
          NEW="${{ steps.analyze.outputs.new_count }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          FINDINGS=$(cat /tmp/findings_summary.txt 2>/dev/null | head -10 || echo "See report")

          MSG="🚨 <b>Vulnerability Scan Report (Nuclei)</b>

          📅 $(date -u +'%Y-%m-%d %H:%M UTC')
          🆕 New: <b>${NEW}</b>
          📊 Total: ${TOTAL} (🔴${CRITICAL} 🟠${HIGH} 🟡${MEDIUM})

          <b>Findings:</b>
          <pre>${FINDINGS}</pre>

          🔗 <a href=\"${RUN_URL}\">Full report</a>"

          # Trim leading whitespace from heredoc
          MSG=$(echo "$MSG" | sed 's/^          //')

          wget -qO- --post-data="chat_id=${TELEGRAM_CHAT_ID}&text=${MSG}&parse_mode=HTML&disable_web_page_preview=true" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            || echo "::warning::Telegram send failed"

      - name: Send Telegram all-clear
        if: steps.analyze.outputs.new_count == '0' || steps.analyze.outputs.total == '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TOTAL="${{ steps.analyze.outputs.total }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          MSG="✅ <b>Daily Vulnerability Scan (Nuclei)</b>

          📅 $(date -u +'%Y-%m-%d %H:%M UTC')
          No new vulnerabilities detected.
          Known: ${TOTAL}

          🔗 <a href=\"${RUN_URL}\">Details</a>"

          MSG=$(echo "$MSG" | sed 's/^          //')

          wget -qO- --post-data="chat_id=${TELEGRAM_CHAT_ID}&text=${MSG}&parse_mode=HTML&disable_web_page_preview=true" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            || echo "::warning::Telegram send failed"

      - name: Save scan for next comparison
        if: always()
        run: |
          mkdir -p scan-history
          if [ -f scan-results/current.json ]; then
            cp scan-results/current.json scan-history/previous.json
          fi

      - name: Save scan cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scan-history/
          key: vuln-scan-${{ github.run_number }}

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-scan-results-${{ github.run_number }}
          path: scan-results/
          retention-days: 30

  zap-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare scan workspace
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports
          if [ ! -f targets.txt ]; then
            echo "::error::targets.txt not found"
            exit 1
          fi
          grep -vE '^\s*#|^\s*$' targets.txt > /tmp/active_targets.txt || true

      - name: Run OWASP ZAP Baseline Scan
        run: |
          while IFS= read -r target; do
            [ -z "$target" ] && continue
            domain=$(echo "$target" | sed -e 's|^[^/]*//||' -e 's|[/:]|_|g')
            echo "::group::Scanning $target with OWASP ZAP"
            docker run --rm -v $(pwd)/zap-reports:/zap/wrk:rw \
              ghcr.io/zaproxy/zaproxy:stable \
              zap-baseline.py -t "$target" -J "zap-${domain}.json" -r "zap-${domain}.html" -m 5 -I || true
            echo "::endgroup::"
          done < /tmp/active_targets.txt

      - name: Analyze ZAP results
        id: analyze
        run: |
          python3 -c '
          import json, glob, os

          total_high = 0
          total_med = 0
          total_low = 0
          findings = []

          for f in sorted(glob.glob("zap-reports/*.json")):
              try:
                  with open(f) as jf:
                      data = json.load(jf)
                  site_data = data.get("site", [])
                  if isinstance(site_data, dict):
                      site_data = [site_data]
                  for s in site_data:
                      host = s.get("@name", "")
                      for alert in s.get("alerts", []):
                          risk = str(alert.get("riskcode", "0"))
                          name = alert.get("alert", "")
                          if risk == "3":
                              total_high += 1
                              findings.append(f"[HIGH] {name} -> {host}")
                          elif risk == "2":
                              total_med += 1
                              findings.append(f"[MEDIUM] {name} -> {host}")
                          elif risk == "1":
                              total_low += 1
              except Exception as e:
                  print(f"Error reading {f}: {e}")

          total = total_high + total_med
          summary = "\n".join(findings[:10]) if findings else "No High/Medium vulnerabilities detected."

          with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
              gh_out.write(f"total={total}\n")
              gh_out.write(f"high={total_high}\n")
              gh_out.write(f"medium={total_med}\n")
              gh_out.write(f"low={total_low}\n")
              gh_out.write("findings<<EOF\n" + summary + "\nEOF\n")

          print(f"ZAP Scan summary: total={total} (high={total_high}, medium={total_med}, low={total_low})")
          '

      - name: Send Telegram alert on ZAP findings
        if: steps.analyze.outputs.total != '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TOTAL="${{ steps.analyze.outputs.total }}"
          HIGH="${{ steps.analyze.outputs.high }}"
          MEDIUM="${{ steps.analyze.outputs.medium }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          FINDINGS="${{ steps.analyze.outputs.findings }}"

          MSG="🚨 <b>OWASP ZAP Vulnerability Alert</b>

          📅 $(date -u +'%Y-%m-%d %H:%M UTC')
          📊 Findings: <b>${TOTAL}</b> (🟠 High: ${HIGH} | 🟡 Medium: ${MEDIUM})

          <b>Top Findings:</b>
          <pre>${FINDINGS}</pre>

          🔗 <a href=\"${RUN_URL}\">Full ZAP Report</a>"

          MSG=$(echo "$MSG" | sed 's/^          //')

          wget -qO- --post-data="chat_id=${TELEGRAM_CHAT_ID}&text=${MSG}&parse_mode=HTML&disable_web_page_preview=true" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            || echo "::warning::Telegram send failed"

      - name: Upload ZAP artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-results-${{ github.run_number }}
          path: zap-reports/
          retention-days: 30

  strix-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Strix
        run: |
          curl -sSL https://strix.ai/install | bash
          echo "$HOME/.strix/bin" >> $GITHUB_PATH

      - name: Run Strix AI Penetration Test
        env:
          STRIX_LLM: "openai/crawl-free"
          LLM_API_KEY: ${{ secrets.X9ROUTER_API_KEY }}
          LLM_API_BASE: ${{ secrets.X9ROUTER_URL }}
          OPENAI_API_KEY: ${{ secrets.X9ROUTER_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.X9ROUTER_URL }}
        run: |
          if [ ! -f targets.txt ]; then
            echo "::error::targets.txt not found"
            exit 1
          fi

          mkdir -p strix_runs
          set +e
          strix -n --target-list ./targets.txt --scan-mode quick
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 2 ]; then
            echo "::error::Strix scan failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi

      - name: Analyze Strix results
        id: analyze
        run: |
          python3 -c '
          import json, glob, os, sys

          total_crit = 0
          total_high = 0
          total_med = 0
          total_low = 0
          findings = []

          report_files = sorted(glob.glob("strix_runs/*/vulnerabilities.json"))
          for f in report_files:
              try:
                  with open(f, "r", encoding="utf-8") as jf:
                      data = json.load(jf)
                  for vuln in data:
                      sev = str(vuln.get("severity", "")).lower()
                      title = vuln.get("title", "Untitled")
                      target = vuln.get("target", "")
                      if sev == "critical":
                          total_crit += 1
                          findings.append(f"[CRITICAL] {title} -> {target}")
                      elif sev == "high":
                          total_high += 1
                          findings.append(f"[HIGH] {title} -> {target}")
                      elif sev == "medium":
                          total_med += 1
                          findings.append(f"[MEDIUM] {title} -> {target}")
                      elif sev == "low":
                          total_low += 1
                          findings.append(f"[LOW] {title} -> {target}")
              except Exception as e:
                  print(f"::error::Failed parsing {f}: {e}", file=sys.stderr)
                  sys.exit(1)

          total = total_crit + total_high + total_med + total_low
          summary = "\n".join(findings[:10]) if findings else "No vulnerabilities detected."

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as gh_out:
              gh_out.write(f"total={total}\n")
              gh_out.write(f"critical={total_crit}\n")
              gh_out.write(f"high={total_high}\n")
              gh_out.write(f"medium={total_med}\n")
              gh_out.write(f"low={total_low}\n")
              gh_out.write("findings<<EOF\n" + summary + "\nEOF\n")

          print(f"Strix Scan summary: total={total} (crit={total_crit}, high={total_high}, med={total_med}, low={total_low})")
          '

      - name: Send Telegram alert on Strix findings
        if: steps.analyze.outputs.total != '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOTAL: ${{ steps.analyze.outputs.total }}
          CRITICAL: ${{ steps.analyze.outputs.critical }}
          HIGH: ${{ steps.analyze.outputs.high }}
          MEDIUM: ${{ steps.analyze.outputs.medium }}
          LOW: ${{ steps.analyze.outputs.low }}
          FINDINGS: ${{ steps.analyze.outputs.findings }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 -c '
          import html, json, os, urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")
          total = os.environ.get("TOTAL", "0")
          critical = os.environ.get("CRITICAL", "0")
          high = os.environ.get("HIGH", "0")
          medium = os.environ.get("MEDIUM", "0")
          low = os.environ.get("LOW", "0")
          findings = html.escape(os.environ.get("FINDINGS", ""))
          run_url = html.escape(os.environ.get("RUN_URL", ""))

          msg = (
              f"🚨 <b>Strix AI Pentest Alert</b>\n\n"
              f"📊 Findings: <b>{total}</b> (🔴 Crit: {critical} | 🟠 High: {high} | 🟡 Med: {medium} | 🔵 Low: {low})\n\n"
              f"<b>Top Findings:</b>\n"
              f"<pre>{findings}</pre>\n\n"
              f"🔗 <a href=\"{run_url}\">Full Strix Report</a>"
          )

          data = json.dumps({
              "chat_id": chat_id,
              "text": msg,
              "parse_mode": "HTML",
              "disable_web_page_preview": True
          }).encode("utf-8")

          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=data,
              headers={"Content-Type": "application/json"}
          )

          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  pass
          except Exception as e:
              print(f"::warning::Telegram send failed: {e}")
          '

      - name: Upload Strix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-scan-results-${{ github.run_number }}
          path: strix_runs/
          retention-days: 30
