name: Daily Vulnerability Scan

on:
  schedule:
    # Run daily at 2:00 AM UTC (9:00 AM Vietnam)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      severity:
        description: 'Minimum severity (critical,high,medium,low)'
        required: false
        default: 'critical,high,medium'

jobs:
  scan:
    runs-on: ubuntu-latest
    container:
      image: projectdiscovery/nuclei:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Nuclei
        run: nuclei -version

      - name: Restore previous scan cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: scan-history/
          key: vuln-scan-
          restore-keys: |
            vuln-scan-

      - name: Update Nuclei templates
        run: nuclei -ut

      - name: Run vulnerability scan
        run: |
          SEVERITY="${{ github.event.inputs.severity || 'critical,high,medium' }}"

          if [ ! -f targets.txt ]; then
            echo "::error::targets.txt not found"
            exit 1
          fi

          grep -vE '^\s*#|^\s*$' targets.txt > /tmp/active_targets.txt || true
          TARGET_COUNT=$(wc -l < /tmp/active_targets.txt)
          echo "Scanning $TARGET_COUNT targets with severity: $SEVERITY"

          mkdir -p scan-results

          nuclei \
            -l /tmp/active_targets.txt \
            -severity "$SEVERITY" \
            -je scan-results/current.json \
            -silent \
            -timeout 15 \
            -retries 2 \
            -bulk-size 25 \
            -rate-limit 50 \
            || true

      - name: Analyze results
        id: analyze
        run: |
          mkdir -p scan-history

          if [ -f scan-results/current.json ] && [ -s scan-results/current.json ]; then
            TOTAL=$(cat scan-results/current.json | python3 -c "import sys,json; print(len(json.load(sys.stdin)))" 2>/dev/null || echo 0)
            CRITICAL=$(cat scan-results/current.json | python3 -c "import sys,json; print(len([x for x in json.load(sys.stdin) if x.get('info',{}).get('severity')=='critical']))" 2>/dev/null || echo 0)
            HIGH=$(cat scan-results/current.json | python3 -c "import sys,json; print(len([x for x in json.load(sys.stdin) if x.get('info',{}).get('severity')=='high']))" 2>/dev/null || echo 0)
            MEDIUM=$(cat scan-results/current.json | python3 -c "import sys,json; print(len([x for x in json.load(sys.stdin) if x.get('info',{}).get('severity')=='medium']))" 2>/dev/null || echo 0)
          else
            TOTAL=0; CRITICAL=0; HIGH=0; MEDIUM=0
            echo "[]" > scan-results/current.json
          fi

          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "medium=$MEDIUM" >> $GITHUB_OUTPUT

          # Compare with previous
          NEW_COUNT=$TOTAL
          if [ -f scan-history/previous.json ] && [ -s scan-history/previous.json ]; then
            NEW_COUNT=$(python3 -c "
          import json
          prev = set()
          curr = set()
          try:
              with open('scan-history/previous.json') as f:
                  for item in json.load(f):
                      prev.add((item.get('host',''), item.get('template-id','')))
          except: pass
          try:
              with open('scan-results/current.json') as f:
                  for item in json.load(f):
                      curr.add((item.get('host',''), item.get('template-id','')))
          except: pass
          print(len(curr - prev))
          " 2>/dev/null || echo "$TOTAL")
          fi

          echo "new_count=$NEW_COUNT" >> $GITHUB_OUTPUT
          echo "Found: $TOTAL total ($CRITICAL critical, $HIGH high, $MEDIUM medium), $NEW_COUNT new"

      - name: Build findings summary
        id: findings
        if: steps.analyze.outputs.total != '0'
        run: |
          python3 -c "
          import json
          with open('scan-results/current.json') as f:
              data = json.load(f)
          for item in data[:10]:
              sev = item.get('info',{}).get('severity','?').upper()
              name = item.get('info',{}).get('name','unknown')
              host = item.get('host','?')
              print(f'[\u200b{sev}] {name} -> {host}')
          " > /tmp/findings_summary.txt 2>/dev/null || echo "See report" > /tmp/findings_summary.txt

      - name: Send Telegram alert
        if: steps.analyze.outputs.new_count != '0' && steps.analyze.outputs.total != '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TOTAL="${{ steps.analyze.outputs.total }}"
          CRITICAL="${{ steps.analyze.outputs.critical }}"
          HIGH="${{ steps.analyze.outputs.high }}"
          MEDIUM="${{ steps.analyze.outputs.medium }}"
          NEW="${{ steps.analyze.outputs.new_count }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          FINDINGS=$(cat /tmp/findings_summary.txt 2>/dev/null | head -10 || echo "See report")

          python3 -c "
          import urllib.request, urllib.parse, sys, os
          msg = '''🚨 <b>Vulnerability Scan Report</b>

          📅 New findings: <b>${NEW}</b>
          📊 Total: ${TOTAL} (🔴${CRITICAL} 🟠${HIGH} 🟡${MEDIUM})

          <b>Top Findings:</b>
          <pre>${FINDINGS}</pre>

          🔗 <a href=\"${RUN_URL}\">View full report</a>'''

          msg = '\n'.join(line.lstrip() for line in msg.strip().splitlines())
          token = os.environ['TELEGRAM_BOT_TOKEN']
          chat_id = os.environ['TELEGRAM_CHAT_ID']
          data = urllib.parse.urlencode({
              'chat_id': chat_id,
              'text': msg,
              'parse_mode': 'HTML',
              'disable_web_page_preview': 'true'
          }).encode()
          req = urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage', data)
          urllib.request.urlopen(req)
          "

      - name: Send Telegram all-clear
        if: steps.analyze.outputs.new_count == '0' || steps.analyze.outputs.total == '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TOTAL="${{ steps.analyze.outputs.total }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          python3 -c "
          import urllib.request, urllib.parse, os
          msg = '''✅ <b>Daily Vulnerability Scan</b>
          No new vulnerabilities detected.
          Known: ${TOTAL}
          🔗 <a href=\"${RUN_URL}\">Details</a>'''

          msg = '\n'.join(line.lstrip() for line in msg.strip().splitlines())
          token = os.environ['TELEGRAM_BOT_TOKEN']
          chat_id = os.environ['TELEGRAM_CHAT_ID']
          data = urllib.parse.urlencode({
              'chat_id': chat_id,
              'text': msg,
              'parse_mode': 'HTML',
              'disable_web_page_preview': 'true'
          }).encode()
          req = urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage', data)
          urllib.request.urlopen(req)
          "

      - name: Save scan for next comparison
        if: always()
        run: |
          mkdir -p scan-history
          if [ -f scan-results/current.json ]; then
            cp scan-results/current.json scan-history/previous.json
          fi

      - name: Save scan cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scan-history/
          key: vuln-scan-${{ github.run_number }}

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_number }}
          path: scan-results/
          retention-days: 30
