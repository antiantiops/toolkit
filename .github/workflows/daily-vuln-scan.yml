name: Daily Vulnerability Scan

on:
  schedule:
    # Run daily at 2:00 AM UTC (9:00 AM Vietnam)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      severity:
        description: 'Minimum severity (critical,high,medium,low)'
        required: false
        default: 'critical,high,medium'

jobs:
  scan:
    runs-on: ubuntu-latest
    container:
      image: projectdiscovery/nuclei:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Nuclei
        run: nuclei -version

      - name: Restore previous scan cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: scan-history/
          key: vuln-scan-
          restore-keys: |
            vuln-scan-

      - name: Update Nuclei templates
        run: nuclei -ut

      - name: Run vulnerability scan
        run: |
          SEVERITY="${{ github.event.inputs.severity || 'critical,high,medium' }}"

          if [ ! -f targets.txt ]; then
            echo "::error::targets.txt not found"
            exit 1
          fi

          grep -vE '^\s*#|^\s*$' targets.txt > /tmp/active_targets.txt || true
          TARGET_COUNT=$(wc -l < /tmp/active_targets.txt)
          echo "Scanning $TARGET_COUNT targets with severity: $SEVERITY"

          mkdir -p scan-results

          nuclei \
            -l /tmp/active_targets.txt \
            -severity "$SEVERITY" \
            -je scan-results/current.json \
            -silent \
            -timeout 15 \
            -retries 2 \
            -bulk-size 25 \
            -rate-limit 50 \
            || true

      - name: Analyze results
        id: analyze
        run: |
          mkdir -p scan-history

          # Ensure scan output exists
          if [ ! -f scan-results/current.json ] || [ ! -s scan-results/current.json ]; then
            echo "[]" > scan-results/current.json
          fi

          # Count using grep (no jq/python in nuclei image)
          TOTAL=$(grep -c '"template-id"' scan-results/current.json 2>/dev/null || echo 0)
          CRITICAL=$(grep -c '"severity":"critical"' scan-results/current.json 2>/dev/null || echo 0)
          HIGH=$(grep -c '"severity":"high"' scan-results/current.json 2>/dev/null || echo 0)
          MEDIUM=$(grep -c '"severity":"medium"' scan-results/current.json 2>/dev/null || echo 0)

          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "medium=$MEDIUM" >> $GITHUB_OUTPUT

          # Compare with previous scan
          NEW_COUNT=$TOTAL
          if [ -f scan-history/previous.json ] && [ -s scan-history/previous.json ]; then
            # Extract host+template-id signatures
            grep -oP '"host":"[^"]+","template-id":"[^"]+"' scan-history/previous.json 2>/dev/null | sort -u > /tmp/prev_sigs.txt || true
            grep -oP '"host":"[^"]+","template-id":"[^"]+"' scan-results/current.json 2>/dev/null | sort -u > /tmp/curr_sigs.txt || true
            NEW_COUNT=$(comm -13 /tmp/prev_sigs.txt /tmp/curr_sigs.txt | wc -l)
          fi

          echo "new_count=$NEW_COUNT" >> $GITHUB_OUTPUT

          # Build findings summary (top 10)
          grep -oP '\{"template-id":"[^"]+".+?\}' scan-results/current.json 2>/dev/null | head -10 | while IFS= read -r line; do
            SEV=$(echo "$line" | grep -oP '"severity":"[^"]+"' | head -1 | cut -d'"' -f4)
            NAME=$(echo "$line" | grep -oP '"name":"[^"]+"' | head -1 | cut -d'"' -f4)
            HOST=$(echo "$line" | grep -oP '"host":"[^"]+"' | head -1 | cut -d'"' -f4)
            SEV_UP=$(echo "$SEV" | tr '[:lower:]' '[:upper:]')
            echo "[$SEV_UP] $NAME -> $HOST"
          done > /tmp/findings_summary.txt 2>/dev/null || true

          FINDINGS=$(cat /tmp/findings_summary.txt 2>/dev/null || echo "")
          # Escape for GITHUB_OUTPUT multiline
          {
            echo 'findings<<FINDINGSEOF'
            echo "$FINDINGS"
            echo 'FINDINGSEOF'
          } >> $GITHUB_OUTPUT

          echo "Found: $TOTAL total ($CRITICAL critical, $HIGH high, $MEDIUM medium), $NEW_COUNT new"

      - name: Send Telegram alert
        if: steps.analyze.outputs.new_count != '0' && steps.analyze.outputs.total != '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TOTAL="${{ steps.analyze.outputs.total }}"
          CRITICAL="${{ steps.analyze.outputs.critical }}"
          HIGH="${{ steps.analyze.outputs.high }}"
          MEDIUM="${{ steps.analyze.outputs.medium }}"
          NEW="${{ steps.analyze.outputs.new_count }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          FINDINGS="${{ steps.analyze.outputs.findings }}"

          MSG=$(cat <<MSGEOF
🚨 <b>Vulnerability Scan Report</b>

📅 $(date -u +'%Y-%m-%d %H:%M UTC')
🆕 New findings: <b>${NEW}</b>
📊 Total: ${TOTAL} (🔴${CRITICAL} 🟠${HIGH} 🟡${MEDIUM})

<b>Top Findings:</b>
<pre>${FINDINGS:-No details}</pre>

🔗 <a href="${RUN_URL}">View full report</a>
MSGEOF
          )

          wget -qO- --post-data="chat_id=${TELEGRAM_CHAT_ID}&text=${MSG}&parse_mode=HTML&disable_web_page_preview=true" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" || echo "::warning::Telegram send failed"

      - name: Send Telegram all-clear
        if: steps.analyze.outputs.new_count == '0' || steps.analyze.outputs.total == '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TOTAL="${{ steps.analyze.outputs.total }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          MSG=$(cat <<MSGEOF
✅ <b>Daily Vulnerability Scan</b>

📅 $(date -u +'%Y-%m-%d %H:%M UTC')
No new vulnerabilities detected.
Known: ${TOTAL}

🔗 <a href="${RUN_URL}">Details</a>
MSGEOF
          )

          wget -qO- --post-data="chat_id=${TELEGRAM_CHAT_ID}&text=${MSG}&parse_mode=HTML&disable_web_page_preview=true" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" || echo "::warning::Telegram send failed"

      - name: Save scan for next comparison
        if: always()
        run: |
          mkdir -p scan-history
          if [ -f scan-results/current.json ]; then
            cp scan-results/current.json scan-history/previous.json
          fi

      - name: Save scan cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scan-history/
          key: vuln-scan-${{ github.run_number }}

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_number }}
          path: scan-results/
          retention-days: 30
