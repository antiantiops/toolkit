name: Daily Vulnerability Scan

on:
  schedule:
    # Run daily at 2:00 AM UTC (9:00 AM Vietnam)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      severity:
        description: 'Minimum severity (critical,high,medium,low)'
        required: false
        default: 'critical,high,medium'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore previous scan cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: scan-history/
          key: vuln-scan-
          restore-keys: |
            vuln-scan-

      - name: Install Nuclei
        run: |
          NUCLEI_VERSION=$(curl -sS https://api.github.com/repos/projectdiscovery/nuclei/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          curl -sSL "https://github.com/projectdiscovery/nuclei/releases/latest/download/nuclei_${NUCLEI_VERSION}_linux_amd64.zip" -o nuclei.zip
          unzip -o nuclei.zip nuclei
          chmod +x nuclei
          sudo mv nuclei /usr/local/bin/
          nuclei -version

      - name: Update Nuclei templates
        run: nuclei -ut -ud /tmp/nuclei-templates

      - name: Run vulnerability scan
        run: |
          SEVERITY="${{ github.event.inputs.severity || 'critical,high,medium' }}"

          if [ ! -f targets.txt ]; then
            echo "::error::targets.txt not found in repository root"
            exit 1
          fi

          grep -vE '^\s*#|^\s*$' targets.txt > /tmp/active_targets.txt || true
          TARGET_COUNT=$(wc -l < /tmp/active_targets.txt)
          echo "Scanning $TARGET_COUNT targets with severity: $SEVERITY"

          mkdir -p scan-results

          nuclei \
            -l /tmp/active_targets.txt \
            -severity "$SEVERITY" \
            -ud /tmp/nuclei-templates \
            -je scan-results/current.json \
            -silent \
            -timeout 15 \
            -retries 2 \
            -bulk-size 25 \
            -rate-limit 50 \
            || true

      - name: Analyze results
        id: analyze
        run: |
          mkdir -p scan-history

          if [ -f scan-results/current.json ] && [ -s scan-results/current.json ]; then
            TOTAL=$(jq 'length' scan-results/current.json)
            CRITICAL=$(jq '[.[] | select(.info.severity=="critical")] | length' scan-results/current.json)
            HIGH=$(jq '[.[] | select(.info.severity=="high")] | length' scan-results/current.json)
            MEDIUM=$(jq '[.[] | select(.info.severity=="medium")] | length' scan-results/current.json)
          else
            TOTAL=0; CRITICAL=0; HIGH=0; MEDIUM=0
            echo "[]" > scan-results/current.json
          fi

          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "medium=$MEDIUM" >> $GITHUB_OUTPUT

          # Compare with previous
          NEW_COUNT=$TOTAL
          if [ -f scan-history/previous.json ] && [ -s scan-history/previous.json ]; then
            jq -r '.[] | [.host, .["template-id"]] | @csv' scan-history/previous.json 2>/dev/null | sort -u > /tmp/prev.txt || touch /tmp/prev.txt
            jq -r '.[] | [.host, .["template-id"]] | @csv' scan-results/current.json 2>/dev/null | sort -u > /tmp/curr.txt || touch /tmp/curr.txt
            NEW_COUNT=$(comm -13 /tmp/prev.txt /tmp/curr.txt | wc -l)
          fi

          echo "new_count=$NEW_COUNT" >> $GITHUB_OUTPUT
          echo "Found: $TOTAL total ($CRITICAL critical, $HIGH high, $MEDIUM medium), $NEW_COUNT new"

      - name: Build findings summary
        id: findings
        if: steps.analyze.outputs.total != '0'
        run: |
          SUMMARY=$(jq -r '.[] | "• [\(.info.severity | ascii_upcase)] \(.info.name) → \(.host)"' scan-results/current.json | head -10)
          # Write to file to avoid escaping issues
          echo "$SUMMARY" > /tmp/findings_summary.txt

      - name: Send Telegram alert (new vulns found)
        if: steps.analyze.outputs.new_count != '0' && steps.analyze.outputs.total != '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TOTAL="${{ steps.analyze.outputs.total }}"
          CRITICAL="${{ steps.analyze.outputs.critical }}"
          HIGH="${{ steps.analyze.outputs.high }}"
          MEDIUM="${{ steps.analyze.outputs.medium }}"
          NEW="${{ steps.analyze.outputs.new_count }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          MSG="🚨 <b>Vulnerability Scan Report</b>

          📅 $(date -u +'%Y-%m-%d %H:%M UTC')
          🆕 New findings: <b>${NEW}</b>
          📊 Total: ${TOTAL} (🔴${CRITICAL} 🟠${HIGH} 🟡${MEDIUM})

          <b>Top Findings:</b>
          <pre>$(cat /tmp/findings_summary.txt 2>/dev/null || echo 'See report')</pre>

          🔗 <a href=\"${RUN_URL}\">View full report</a>"

          # Trim leading whitespace from heredoc
          MSG=$(echo "$MSG" | sed 's/^          //')

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"

      - name: Send Telegram all-clear
        if: steps.analyze.outputs.new_count == '0' || steps.analyze.outputs.total == '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TOTAL="${{ steps.analyze.outputs.total }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          MSG="✅ <b>Daily Vulnerability Scan</b>

          📅 $(date -u +'%Y-%m-%d %H:%M UTC')
          No new vulnerabilities detected.
          Known: ${TOTAL}

          🔗 <a href=\"${RUN_URL}\">Details</a>"

          MSG=$(echo "$MSG" | sed 's/^          //')

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"

      - name: Save scan for next comparison
        uses: actions/cache/save@v4
        with:
          path: scan-history/
          key: vuln-scan-${{ github.run_number }}

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_number }}
          path: scan-results/
          retention-days: 30
