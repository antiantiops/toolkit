name: Build and Push 9router Image

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      router_version:
        description: "9router version (leave empty for default)"
        required: false
        type: string

env:
  IMAGE_NAME: antiantiops/9router
  # Updated by 9router Release Watch from decolua/9router GitHub tags.
  DEFAULT_ROUTER_VERSION: "0.5.65"
  DEFAULT_ROUTER_TAG: "v0.5.65"
  DEFAULT_ROUTER_COMMIT: "4eda76e2abbcffe6e1b0511f4117f448240c46db"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout toolkit repository
        uses: actions/checkout@v4

      - name: Select immutable upstream source
        id: router
        shell: bash
        run: |
          VERSION='${{ inputs.router_version || env.DEFAULT_ROUTER_VERSION }}'
          if [[ "$VERSION" != "${{ env.DEFAULT_ROUTER_VERSION }}" ]]; then
            echo "Manual versions are not supported until a matching tag/SHA is supplied." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${{ env.DEFAULT_ROUTER_TAG }}" >> "$GITHUB_OUTPUT"
          echo "commit=${{ env.DEFAULT_ROUTER_COMMIT }}" >> "$GITHUB_OUTPUT"

      - name: Checkout upstream source at pinned commit
        uses: actions/checkout@v4
        with:
          repository: decolua/9router
          ref: ${{ steps.router.outputs.commit }}
          path: upstream
          fetch-depth: 1

      - name: Verify upstream tag and package version
        working-directory: upstream
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = '${{ steps.router.outputs.commit }}'
          test "$(node -p "require('./cli/package.json').version")" = '${{ steps.router.outputs.version }}'
          echo "Building decolua/9router ${{ steps.router.outputs.tag }} at $(git rev-parse HEAD)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.router.outputs.version }}-{{sha}}
            type=raw,value=${{ steps.router.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/decolua/9router
            org.opencontainers.image.revision=${{ steps.router.outputs.commit }}
            org.opencontainers.image.version=${{ steps.router.outputs.tag }}

      - name: Build and push upstream image
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          file: ./upstream/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=9router
          cache-to: type=gha,mode=max,scope=9router
