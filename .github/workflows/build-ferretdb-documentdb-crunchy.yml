name: Build FerretDB DocumentDB for Crunchy PGO

on:
  push:
    branches: [master]
    paths:
      - ferretdb-documentdb-crunchy/**
      - .github/workflows/build-ferretdb-documentdb-crunchy.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./ferretdb-documentdb-crunchy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            antiantiops/ferretdb-documentdb-crunchy:17-0.107.0-ferretdb-2.7.0
            antiantiops/ferretdb-documentdb-crunchy:latest
          provenance: false
