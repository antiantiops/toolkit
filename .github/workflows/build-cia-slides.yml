name: Build CIA Slides

on:
  push:
    branches: [master]
    paths:
      - 'cia-slides/**'
      - '.github/workflows/build-cia-slides.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cia-slides-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Test server
        run: node --test cia-slides/server/test.mjs
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./cia-slides
          file: ./cia-slides/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            antiantiops/cia-slides:latest
            antiantiops/cia-slides:sha-${{ github.sha }}
          cache-from: type=gha,scope=cia-slides
          cache-to: type=gha,mode=max,scope=cia-slides
