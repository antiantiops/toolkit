name: Manual Strix Security Scan

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Authorized HTTPS target, e.g. https://nimtechnology.com"
        required: true
        type: string
      scan_mode:
        description: "Strix scan mode"
        required: true
        default: quick
        type: choice
        options:
          - quick
          - standard

permissions:
  contents: read

jobs:
  strix-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate target
        id: target
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            https://nimtechnology.com|https://nimtechnology.com/*|https://*.nimtechnology.com|https://*.nimtechnology.com/*) ;;
            *)
              echo "::error::Target is not allowlisted: $TARGET"
              exit 1
              ;;
          esac
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Scanning authorized target: $TARGET"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Strix
        run: |
          curl -fsSL https://strix.ai/install | bash
          echo "$HOME/.strix/bin" >> "$GITHUB_PATH"

      - name: Run Strix AI Penetration Test
        shell: bash
        env:
          TARGET: ${{ steps.target.outputs.target }}
          SCAN_MODE: ${{ inputs.scan_mode }}
          STRIX_LLM: openai/crawl-free
          LLM_API_KEY: ${{ secrets.X9ROUTER_API_KEY }}
          LLM_API_BASE: ${{ secrets.X9ROUTER_URL }}
          OPENAI_API_KEY: ${{ secrets.X9ROUTER_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.X9ROUTER_URL }}
        run: |
          set -o pipefail
          mkdir -p strix_runs
          started=$(date +%s)
          echo "::group::Strix live scan: $TARGET ($SCAN_MODE)"
          set +e
          timeout --foreground 25m stdbuf -oL -eL \
            strix -n --target "$TARGET" --scan-mode "$SCAN_MODE" 2>&1 | tee strix_runs/console.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "::endgroup::"
          echo "Strix finished after $(( $(date +%s) - started )) seconds with exit code $rc"
          if [ "$rc" -eq 124 ]; then
            echo "::error::Strix timed out after 25 minutes"
            exit 1
          fi
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "::error::Strix scan failed with exit code $rc"
            exit "$rc"
          fi

      - name: Analyze Strix results
        id: analyze
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os

          counts = {"critical": 0, "high": 0, "medium": 0, "low": 0}
          findings = []
          for path in sorted(glob.glob("strix_runs/*/vulnerabilities.json")):
              with open(path, encoding="utf-8") as handle:
                  for finding in json.load(handle):
                      severity = str(finding.get("severity", "")).lower()
                      if severity in counts:
                          counts[severity] += 1
                          findings.append(
                              f"[{severity.upper()}] {finding.get('title', 'Untitled')} -> {finding.get('target', '')}"
                          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"total={sum(counts.values())}\n")
              for severity, count in counts.items():
                  output.write(f"{severity}={count}\n")
              output.write("findings<<EOF\n" + "\n".join(findings[:10]) + "\nEOF\n")
          print(f"Strix findings: {sum(counts.values())} ({counts})")
          PY

      - name: Write job summary
        if: always()
        env:
          TARGET: ${{ steps.target.outputs.target }}
          SCAN_MODE: ${{ inputs.scan_mode }}
          TOTAL: ${{ steps.analyze.outputs.total }}
          CRITICAL: ${{ steps.analyze.outputs.critical }}
          HIGH: ${{ steps.analyze.outputs.high }}
          MEDIUM: ${{ steps.analyze.outputs.medium }}
          LOW: ${{ steps.analyze.outputs.low }}
        run: |
          {
            echo "## Strix manual scan"
            echo
            echo "- Target: \`$TARGET\`"
            echo "- Mode: \`$SCAN_MODE\`"
            echo "- Findings: $TOTAL (critical: $CRITICAL, high: $HIGH, medium: $MEDIUM, low: $LOW)"
            echo "- Live output: job step **Run Strix AI Penetration Test**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Strix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-scan-results-${{ github.run_number }}
          path: strix_runs/
          if-no-files-found: warn
          retention-days: 30
